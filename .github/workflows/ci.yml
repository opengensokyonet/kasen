name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: |
          rustup show
          rustc --version --verbose
      - name: Fetch dependency sources
        run: cargo fetch --locked
      - name: Format and lint
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Check the package without the standard library
        run: cargo clippy --locked -p kasen_handshake --target x86_64-unknown-none --no-default-features -- -D warnings
      - name: Test workspace and documentation
        run: |
          cargo test --locked --workspace --all-targets
          cargo test --locked --workspace --all-targets --all-features
          cargo test --locked --workspace --doc
          cargo test --locked --workspace --doc --all-features
