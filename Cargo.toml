[workspace]
members = ["crates/kasen_handshake"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
bytes = { version = "1.12.1", default-features = false }
hashbrown = { version = "0.17.1", default-features = false }
nitori_call = { git = "https://github.com/opengensokyonet/nitori", rev = "0de5f36b921c891815d138226c6180c6aa70953b", default-features = false }
nitori_crypto = { git = "https://github.com/opengensokyonet/nitori", rev = "0de5f36b921c891815d138226c6180c6aa70953b" }
nitori_crypto_aws_lc = { git = "https://github.com/opengensokyonet/nitori", rev = "0de5f36b921c891815d138226c6180c6aa70953b" }
nitori_io = { git = "https://github.com/opengensokyonet/nitori", rev = "0de5f36b921c891815d138226c6180c6aa70953b", default-features = false }
nitori_sync = { git = "https://github.com/opengensokyonet/nitori", rev = "0de5f36b921c891815d138226c6180c6aa70953b", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["std", "aws_lc_rs"] }
rustls-pki-types = { version = "1.15.1", default-features = false, features = ["alloc"] }
rustls-webpki = { version = "0.103.16", default-features = false, features = ["alloc"] }
smallvec = { version = "1.16.4", features = ["const_generics"] }
snafu = { version = "0.9.2", git = "https://github.com/opengensokyonet/snafu", rev = "03cb8d2e52a3b0b33a39cc3d4ce8a7075fa4ab58", default-features = false, features = ["rust_1_81"] }
time = { version = "0.3.55", default-features = false }
